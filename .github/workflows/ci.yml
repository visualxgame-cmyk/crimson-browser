name: Build and smoke test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CrimsonBrowser.csproj -c Release --nologo
      - run: dotnet run --project tests/CrimsonBrowser.SmokeTests/CrimsonBrowser.SmokeTests.csproj -c Release --nologo
