name: Build Windows packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compile application and smoke harness
        shell: pwsh
        run: |
          dotnet build src/Vela/Vela.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Vela.SmokeTests/Vela.SmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare installer compiler
        shell: pwsh
        run: ./scripts/Get-InstallerCompiler.ps1
      - name: Package unsigned review build
        shell: pwsh
        run: ./scripts/Package-Release.ps1
      - name: Verify package integrity
        shell: pwsh
        run: ./scripts/Verify-Release.ps1 -Directory artifacts/releases
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-review
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14
