<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab nou</title>

<script>
  // Theme comes from the browser through query parameters (first paint) and through
  // window.velaApplyTheme (live updates while the settings window is open).
  (function () {
    function rgba(hex, alpha) {
      const match = /^#?([0-9a-f]{6})$/i.exec(hex || '');
      if (!match) return 'rgba(251, 84, 43, ' + alpha + ')';
      const n = parseInt(match[1], 16);
      return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + alpha + ')';
    }

    window.velaApplyTheme = function (next) {
      if (!next) return;
      const root = document.documentElement;
      const set = (name, value) => { if (value) root.style.setProperty(name, value); };

      set('--accent', next.accent);
      set('--surface', next.surface);
      set('--surface-2', next.surface2);
      set('--border', next.border);
      set('--text', next.text);
      set('--muted', next.muted);
      set('--dim', next.dim);
      set('--bg', next.bg);

      if (next.accent) {
        set('--accent-soft', rgba(next.accent, 0.55));
        set('--accent-faint', rgba(next.accent, 0.10));
        set('--accent-glow', rgba(next.accent, 0.16));
      }

      set('--bg-image', next.img
        ? 'linear-gradient(rgba(8, 9, 11, 0.55), rgba(8, 9, 11, 0.82)), url("' + next.img + '")'
        : 'radial-gradient(900px 380px at 50% -160px, var(--accent-glow, rgba(251, 84, 43, 0.16)), transparent 70%)');
    };

    const params = new URLSearchParams(location.search);
    const cfg = {};
    for (const key of ['accent', 'surface', 'surface2', 'border', 'text', 'muted', 'dim', 'bg', 'img']) {
      const value = params.get(key);
      if (value) cfg[key] = value;
    }

    if (Object.keys(cfg).length) window.velaApplyTheme(cfg);
  })();
</script>
<style>
  :root {
    --bg: #101114;
    --surface: #1b1d23;
    --surface-2: #24262d;
    --border: #2e313a;
    --text: #ecedf1;
    --muted: #9aa0ad;
    --dim: #6e7280;
    --accent: #fb542b;
    --accent-soft: rgba(251, 84, 43, 0.55);
    --accent-faint: rgba(251, 84, 43, 0.10);
    --accent-glow: rgba(251, 84, 43, 0.16);
    --bg-image: radial-gradient(900px 380px at 50% -160px, var(--accent-glow), transparent 70%);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    gap: 34px;
    padding: 40px 24px;
    user-select: none;
    overflow: auto;
    transition: background-color .18s ease;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -1.2px;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    transform: translateY(-3px);
  }

  .search {
    width: min(620px, 92vw);
    height: 52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 8px 0 16px;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .search:focus-within {
    border-color: var(--accent-soft);
    background: var(--surface-2);
    box-shadow: 0 0 0 3px var(--accent-faint);
  }

  .search svg { flex: none; opacity: .55; color: var(--muted); }

  .search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 0 12px;
    height: 100%;
  }

  .search input::placeholder { color: var(--dim); }

  .search .hint {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 7px;
    margin-right: 6px;
    white-space: nowrap;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(6, 88px);
    gap: 14px;
  }

  .shortcuts { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .shortcut-actions { display: flex; gap: 8px; }
  button, dialog input { font: inherit; }
  button { cursor: pointer; }
  .quiet-button, .tile-tools button, dialog button {
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 10px; font-size: 12px;
  }
  button:hover { color: var(--text); background: var(--surface-2); }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tile-tools { display: none; grid-template-columns: repeat(2, 1fr); gap: 3px; margin-top: 5px; }
  .editing .tile-tools { display: grid; }
  .tile-tools button { padding: 4px 0; font-size: 11px; }
  dialog {
    width: min(400px, 90vw); color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 24px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  dialog h2 { font-size: 19px; margin: 0 0 18px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin-top: 12px; }
  dialog input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; margin-top: 6px; user-select: text;
  }
  dialog p { font-size: 12px; line-height: 1.5; color: var(--muted); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  dialog .primary { background: var(--accent); color: white; border-color: var(--accent); }
  #shortcut-error { color: var(--text); min-height: 18px; font-size: 12px; max-width: 590px; text-align: center; }
  #dialog-error { color: #f39489; }

  @media (max-width: 700px) {
    .tiles { grid-template-columns: repeat(3, 88px); }
  }

  .tile {
    width: 88px;
    height: 82px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }

  .tile:hover {
    background: var(--surface-2);
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .tile:active { transform: translateY(0) scale(.98); }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
  }

  .avatar.has-icon { background: #f4f5f7; overflow: hidden; }

  .avatar img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    display: block;
  }

  .tile span {
    font-size: 11px;
    color: var(--muted);
    max-width: 76px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }

  .stat {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .stat b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5fcb7c;
  }

  .footer {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    gap: 18px;
  }

  kbd {
    font-family: inherit;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 10.5px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="brand">vela<span class="dot"></span></div>

  <label class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="q" type="text" placeholder="Caută pe web sau tastează o adresă" autocomplete="off"
           spellcheck="false" autofocus>
    <span class="hint">Enter</span>
  </label>

  <section class="shortcuts" aria-label="Scurtături">
    <div class="tiles" id="tiles"></div>
    <div class="shortcut-actions">
      <button class="quiet-button" id="add-shortcut" type="button">+ Adaugă site</button>
      <button class="quiet-button" id="edit-shortcuts" type="button" aria-pressed="false">Personalizează</button>
    </div>
    <div id="shortcut-error" role="status"></div>
  </section>

  <dialog id="shortcut-dialog" aria-labelledby="shortcut-title">
    <form id="shortcut-form">
      <h2 id="shortcut-title">Adaugă site</h2>
      <label>Nume<input id="shortcut-name" maxlength="40" required autocomplete="off"></label>
      <label>Adresă<input id="shortcut-url" maxlength="2048" required autocomplete="off" placeholder="https://exemplu.ro"></label>
      <p>Logo-ul se salvează local după prima vizită pe site.</p>
      <p id="dialog-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-shortcut">Anulează</button>
        <button type="submit" id="save-shortcut" class="primary">Salvează</button>
      </div>
    </form>
  </dialog>

  <div class="stats">
    <div class="stat"><span class="led"></span>RAM <b id="ram">–</b></div>
    <div class="stat">Procese <b id="procs">–</b></div>
    <div class="stat">Tab-uri <b id="tabs">–</b></div>
    <div class="stat">În repaus <b id="sleeping">–</b></div>
    <div class="stat">Blocate <b id="blocked">–</b></div>
  </div>

  <div class="footer">
    <span><kbd>Ctrl</kbd>+<kbd>T</kbd> tab nou</span>
    <span><kbd>Ctrl</kbd>+<kbd>L</kbd> adresă</span>
    <span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> redeschide</span>
  </div>

<script>
  let sites = [
    { name: 'YouTube',  url: 'https://www.youtube.com',        icon: 'youtube.ico',   color: '#e5372b' },
    { name: 'GitHub',   url: 'https://github.com',             icon: 'github.ico',    color: '#5b6472' },
    { name: 'Wikipedia',url: 'https://ro.wikipedia.org',       icon: 'wikipedia.ico', color: '#339966' },
    { name: 'Reddit',   url: 'https://www.reddit.com',         icon: 'reddit.png',    color: '#ff5a1f' },
    { name: 'Gmail',    url: 'https://mail.google.com',        icon: 'gmail.ico',     color: '#c5453a' },
    { name: 'Meteo',    url: 'https://www.meteoblue.com',      icon: 'meteoblue.ico', color: '#3a7bd5' }
  ];

  const tiles = document.getElementById('tiles');
  sites = sites.map((site, index) => ({ ...site, id: String(index), icon: 'site-icons/' + site.icon }));
  const dialog = document.getElementById('shortcut-dialog');
  const editButton = document.getElementById('edit-shortcuts');
  const saveButton = document.getElementById('save-shortcut');
  const errorText = document.getElementById('shortcut-error');
  let editingId = null;
  let editing = false;
  let saving = false;

  function renderTiles() {
    const focused = document.activeElement;
    const focusedId = focused?.dataset.shortcutId;
    const focusedAction = focused?.dataset.action;
    tiles.replaceChildren();
    sites.forEach((site, index) => {
      const wrapper = document.createElement('div');
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = site.url;
      a.title = site.url;
      a.addEventListener('click', (event) => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        post({ type: 'navigate', url: site.url });
      });

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.backgroundColor = site.color || 'var(--surface-2)';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = site.name[0];

      const icon = document.createElement('img');
      icon.alt = '';
      icon.width = 32;
      icon.height = 32;
      icon.addEventListener('load', () => {
        avatar.replaceChildren(icon);
        avatar.style.removeProperty('background-color');
        avatar.classList.add('has-icon');
      }, { once: true });
      // Keep the initial visible if the bundled image is missing or cannot decode.
      if (site.icon) icon.src = site.icon;

      const label = document.createElement('span');
      label.textContent = site.name;

      a.append(avatar, label);
      const tools = document.createElement('div');
      tools.className = 'tile-tools';
      const actions = [
        ['edit', 'Editează', () => openShortcut(site)],
        ['remove', 'Șterge', () => {
          if (confirm('Ștergi scurtătura „' + site.name + '”?')) requestShortcut({ type: 'shortcut-remove', id: site.id });
        }],
        ['left', '←', () => requestShortcut({ type: 'shortcut-move', id: site.id, direction: -1 })],
        ['right', '→', () => requestShortcut({ type: 'shortcut-move', id: site.id, direction: 1 })]
      ];
      for (const [action, text, callback] of actions) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = text;
        button.dataset.shortcutId = site.id;
        button.dataset.action = action;
        button.setAttribute('aria-label', (action === 'left' ? 'Mută la stânga' : action === 'right' ? 'Mută la dreapta' : text) + ': ' + site.name);
        button.disabled = (action === 'left' && index === 0) || (action === 'right' && index === sites.length - 1);
        button.addEventListener('click', callback);
        tools.append(button);
      }
      wrapper.append(a, tools);
      tiles.append(wrapper);
    });
    document.getElementById('add-shortcut').disabled = sites.length >= 24;
    if (focusedId && focusedAction) {
      const nextFocus = Array.from(tiles.querySelectorAll('button')).find(button =>
        button.dataset.shortcutId === focusedId && button.dataset.action === focusedAction);
      if (nextFocus && !nextFocus.disabled) nextFocus.focus();
    }
  }

  function openShortcut(site) {
    editingId = site?.id || null;
    document.getElementById('shortcut-title').textContent = site ? 'Editează site' : 'Adaugă site';
    document.getElementById('shortcut-name').value = site?.name || '';
    document.getElementById('shortcut-url').value = site?.url || '';
    document.getElementById('dialog-error').textContent = '';
    dialog.showModal();
    document.getElementById('shortcut-name').focus();
  }

  function requestShortcut(message) {
    errorText.textContent = '';
    if (!(window.chrome && chrome.webview)) {
      document.getElementById('dialog-error').textContent = errorText.textContent = 'Editarea este disponibilă în Vela.';
      return;
    }
    post(message);
  }

  document.getElementById('add-shortcut').addEventListener('click', () => openShortcut(null));
  editButton.addEventListener('click', () => {
    editing = !editing;
    tiles.classList.toggle('editing', editing);
    editButton.setAttribute('aria-pressed', String(editing));
    editButton.textContent = editing ? 'Gata' : 'Personalizează';
  });
  document.getElementById('cancel-shortcut').addEventListener('click', () => { if (!saving) dialog.close(); });
  dialog.addEventListener('cancel', event => { if (saving) event.preventDefault(); });
  document.getElementById('shortcut-form').addEventListener('submit', event => {
    event.preventDefault();
    if (saving) return;
    const name = document.getElementById('shortcut-name').value.trim();
    let url = document.getElementById('shortcut-url').value.trim();
    if (!url.includes('://')) url = 'https://' + url;
    try {
      const parsed = new URL(url);
      if (!['https:', 'http:'].includes(parsed.protocol) || parsed.username || parsed.password || !name) throw new Error();
      url = parsed.href;
    } catch {
      document.getElementById('dialog-error').textContent = 'Introdu un nume și o adresă HTTP sau HTTPS validă, fără parolă.';
      return;
    }
    if (window.chrome && chrome.webview) saving = saveButton.disabled = true;
    requestShortcut({ type: 'shortcut-save', id: editingId, name, url });
  });
  renderTiles();

  function post(message) {
    if (window.chrome && chrome.webview) chrome.webview.postMessage(message);
  }

  const input = document.getElementById('q');
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    const value = input.value.trim();
    if (!value) return;
    post({ type: 'search', q: value });
  });

  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener('message', (event) => {
      const data = event.data;
      if (data?.type === 'shortcuts' && Array.isArray(data.items)) {
        sites = data.items;
        renderTiles();
        return;
      }
      if (data?.type === 'shortcut-saved') {
        saving = saveButton.disabled = false;
        if (dialog.open) dialog.close();
        return;
      }
      if (data?.type === 'shortcut-error') {
        saving = saveButton.disabled = false;
        document.getElementById('dialog-error').textContent = errorText.textContent = data.message;
        return;
      }
      if (!data || data.type !== 'stats') return;

      document.getElementById('ram').textContent = data.ramMB + ' MB';
      document.getElementById('procs').textContent = data.processes;
      document.getElementById('tabs').textContent = data.tabs;
      document.getElementById('sleeping').textContent = data.sleeping;
      document.getElementById('blocked').textContent = data.blocked;
    });
    post({ type: 'shortcuts-ready' });
  }

  input.focus();

  // Keep the clock-free page calm but let Esc clear the box.
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') input.value = '';
  });
</script>
</body>
</html>
